{% extends "base.html" %}
{% block content %}
<div class="page-header"><div><h1>{{ t('rule_new_title') }}</h1><p>{{ t('rule_new_sub') }}</p></div></div>
<div class="card">
  <form method="post" action="/rules/create">
    <div class="grid grid-2">
      <div class="field"><label>{{ t('field_rule_id') }}</label><input type="text" name="rule_id" placeholder="CUSTOM-001" required></div>
      <div class="field">
        <label>{{ t('field_owasp') }}</label>
        <select name="owasp">
          {% for code in owasp_categories %}
          <option value="{{ code }}">{{ code }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="field">
        <label>{{ t('field_severity') }}</label>
        <select name="severity">
          <option value="critical">critical</option>
          <option value="high" selected>high</option>
          <option value="medium">medium</option>
          <option value="low">low</option>
        </select>
      </div>
      <div class="field"><label>{{ t('field_module') }}</label><input type="text" name="module" placeholder="e.g. My Client Engagement"></div>
    </div>
    <div class="field"><label>{{ t('field_technique') }}</label><input type="text" name="technique" placeholder="short_technique_name"></div>
    <div class="field">
      <label>{{ t('field_rule_prompt') }}</label>
      <textarea name="prompt" rows="4" placeholder="{{ t('rule_prompt_placeholder') }}" required></textarea>
      <p style="color:var(--text-muted);font-size:14px;margin-top:4px;">{{ t('rule_prompt_hint') }}</p>
    </div>
    <div class="grid grid-2">
      <div class="field">
        <label>{{ t('field_fail_conditions') }}</label>
        <textarea name="fail_conditions" rows="4" placeholder="(?i)(regex one)&#10;(?i)(regex two)" required></textarea>
        <p style="color:var(--text-muted);font-size:14px;margin-top:4px;">{{ t('rule_conditions_hint') }}</p>
      </div>
      <div class="field">
        <label>{{ t('field_pass_conditions') }}</label>
        <textarea name="pass_conditions" rows="4" placeholder="(?i)(cannot do that)"></textarea>
      </div>
    </div>
    <button class="btn btn-primary" type="submit">{{ t('btn_save_rule') }}</button>
  </form>
</div>
{% endblock %}
